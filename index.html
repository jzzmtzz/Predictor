
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Predictor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">

<style>
:root{--bg:#F2F5F0;--surf:#fff;--ink:#0E1B2C;--mute:#5B6B7B;--line:#D9E0D8;--turf:#1F7A4D;--turf-ink:#fff;--card:#F5C518;--card-ink:#0E1B2C;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1420;--surf:#132235;--ink:#EAF1EA;--mute:#93A4B5;--line:#223650;--turf:#3FBF82;--turf-ink:#06210F;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1420;--surf:#132235;--ink:#EAF1EA;--mute:#93A4B5;--line:#223650;--turf:#3FBF82;--turf-ink:#06210F;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;padding:20px 16px 60px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:30px}
h2{font-size:20px;margin:22px 0 10px}
.muted{color:var(--mute);font-size:14px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--turf);color:var(--turf-ink);cursor:pointer}
button.full{width:100%}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sel button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel button.right{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.sel button.wrong{border-color:var(--bad);color:var(--bad)}
.sel button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.sel .lbl{font-size:12px;font-weight:500;color:var(--mute)}
.sel button.on .lbl,.sel button.right .lbl{color:inherit;opacity:.8}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--card-ink)}
.tag.ok{background:var(--turf);color:var(--turf-ink)}
.prize{background:var(--card);color:var(--card-ink);border-radius:14px;padding:14px;margin:14px 0}
.prize b{font-size:18px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--turf)}
.lb{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.lb.me{font-weight:800}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.dev{margin-top:26px;border:1px dashed var(--line);border-radius:14px;padding:12px}
a{color:var(--turf)}

.welcome{
 min-height:75vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.welcome-icon{
 font-size:48px;
 margin-bottom:12px;
 text-align:center;
}

.welcome h1{
 text-align:center;
 margin-bottom:8px;
}

.welcome-intro{
 text-align:center;
 margin-bottom:22px;
 color:var(--mute);
}

.consent-label{
 display:flex;
 align-items:flex-start;
 gap:10px;
 font-size:14px;
 cursor:pointer;
 margin:16px 0;
}

.consent-label input{
 width:20px;
 height:20px;
 flex-shrink:0;
 margin:2px 0 0;
 accent-color:var(--turf);
}

.rules{
 font-size:14px;
 color:var(--mute);
}

.rules p{
 margin:8px 0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const API_URL='https://snsfehdoitghzeogwelr.supabase.co/functions/v1/api';
const API_KEY='sb_publishable_uoekkbHxTMS_vNSL7uq6FQ_EkP1f_PG';

const TG=window.Telegram&&Telegram.WebApp;

if(TG){
 TG.ready();
 TG.expand();
}

const INIT=TG?TG.initData:'';

const OPT=[
 ['1','Home win'],
 ['X','Draw'],
 ['2','Away win']
];

const S={
 round:null,
 fix:[],
 picks:{},
 entry:null,
 lb:[],
 me:'',
 consent:false
};

let err='',busy=false;

const app=document.querySelector('#app');

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));

const fmt=t=>new Intl.DateTimeFormat('en-GB',{
 timeZone:'Europe/Warsaw',
 weekday:'short',
 hour:'2-digit',
 minute:'2-digit'
}).format(t);

const lock=()=>Math.min(...S.fix.map(f=>f.ko));

const open=()=>S.round
 &&S.fix.length>0
 &&S.round.status==='open'
 &&Date.now()<lock();

async function call(action,extra={}){
 try{
  const r=await fetch(API_URL,{
   method:'POST',
   headers:{
    'content-type':'application/json',
    'apikey':API_KEY
   },
   body:JSON.stringify({
    action,
    initData:INIT,
    ...extra
   })
  });

  let j;

  try{
   j=await r.json();
  }catch(_){
   j={};
  }

  if(!r.ok&&!j.error){
   j.error='Server error '+r.status+': '+
   String(j.message||j.code||JSON.stringify(j)).slice(0,200);
  }

  return j;

 }catch(e){
  return{
   error:'Could not reach the server. Check your connection.'
  };
 }
}

async function load(){
 const j=await call('state');

 if(j.error){
  err=j.error;
  return false;
 }

 const previousRound=S.round?.id;

 S.round=j.round;
 S.me=j.me;

 S.fix=(j.fixtures||[]).map(f=>({
  ...f,
  ko:Date.parse(f.kickoff_at)
 }));

 S.entry=j.entry;
 S.lb=j.leaderboard||[];

 S.picks=j.entry
  ?j.entry.picks
  :previousRound===S.round?.id
   ?S.picks
   :{};

 if(previousRound&&previousRound!==S.round?.id){
  S.consent=false;
 }

 return true;
}

const shell=h=>app.innerHTML=`
 <h1>Match Predictor</h1>
 <div class="panel" style="margin-top:14px">
 ${h}
 </div>
`;

async function boot(){

 if(!INIT){
  return shell('Open this from Telegram to play.');
 }

 app.innerHTML='<p class="muted">Loading…</p>';

 if(!(await load())){
  shell(`${esc(err)}<br><br>
  <button id="r">Try again</button>`);

  document.querySelector('#r').onclick=boot;
  return;
 }

 err='';

 render();
}

function welcome(){

 const tot=S.fix.length;

 app.innerHTML=`

 <div class="welcome">

  <div class="welcome-icon">⚽</div>

  <h1>Match Predictor</h1>

  <div class="welcome-intro">
   Predict the matches and compete for prizes!
  </div>

  <div class="prize">

   <b>
    Top ${esc(S.round.winners)} win
    ${esc(S.round.prize.toLowerCase())}
   </b>

   <div>
    Make your predictions and climb the leaderboard.
   </div>

  </div>

  <div class="panel">

   <b>How to play</b>

   <div class="rules">

    <p>1. Predict the results of ${tot} football matches.</p>

    <p>2. Choose home win (1), draw (X), or away win (2).</p>

    <p>3. Earn one point for every correct prediction.</p>

    <p>4. The highest scores win. Ties go to the earlier entry.</p>

    <p>Odds are for reference only and do not affect scoring.</p>

    <p>Predictions cannot be changed after submission.</p>

   </div>

   <label class="consent-label">

    <input type="checkbox" id="accept">

    <span>
     I confirm that I am 18 years of age or older
     and agree to the participation rules above.
    </span>

   </label>

   <button
    class="full"
    id="continue"
    disabled>

    Start predicting

   </button>

   <div class="err">${esc(err)}</div>

  </div>

 </div>

 `;

 const checkbox=document.querySelector('#accept');
 const next=document.querySelector('#continue');

 checkbox.onchange=()=>{
  next.disabled=!checkbox.checked;
 };

 next.onclick=()=>{

  if(!checkbox.checked)return;

  S.consent=true;
  err='';

  render();

  window.scrollTo(0,0);

 };

}

function render(){

 if(!S.round){
  return shell('No round is open yet. Check back soon.');
 }

 if(!S.fix.length){
  return shell('No matches available yet.');
 }

 if(!S.entry&&open()&&!S.consent){
  return welcome();
 }

 round();
}

function round(){

 const done=!!S.entry;

 const n=S.fix.filter(f=>S.picks[f.id]).length;

 const tot=S.fix.length;

 const can=!done&&open();

 const cards=S.fix.map(f=>`

 <div class="panel">

  <div class="muted">${esc(f.league||'')}</div>

  <div class="row" style="margin-top:4px">

   <div>
    <b>${esc(f.home)}</b><br>
    <b>${esc(f.away)}</b>
   </div>

   <span class="tag">${fmt(f.ko)}</span>

  </div>

  <div class="sel">

  ${OPT.map(([k])=>{

   let c=S.picks[f.id]===k?'on':'';

   if(f.result&&c){
    c=f.result===k?'right':'wrong';
   }

   return`
    <button
     data-f="${esc(f.id)}"
     data-k="${k}"
     class="${c}"
     ${can&&!busy?'':'disabled'}>

     <span class="lbl">${k==='X'?'draw':k}</span>

     <b>${Number(f.odds[k]).toFixed(2)}</b>

    </button>
   `;

  }).join('')}

  </div>

  ${f.result?`
   <div class="muted" style="margin-top:8px">
    Final: ${esc(OPT.find(o=>o[0]===f.result)?.[1]||f.result)}
   </div>
  `:''}

 </div>

 `).join('');

 const settled=S.round.status==='settled';

 app.innerHTML=`

 <div class="row">

  <h1>${esc(S.round.title)}</h1>

  <span class="tag ok">${esc(S.me)}</span>

 </div>

 <div class="prize">

  <b>
   Top ${esc(S.round.winners)} win
   ${esc(S.round.prize.toLowerCase())}
  </b>

  <div>
   1 point per correct result
   (1 = home win, 2 = away win).
   Odds are shown for reference and don't change scoring.
   Ties go to the earlier entry.
  </div>

 </div>

 ${done?`

  <div class="panel">

   <b>Your picks are locked in.</b>

   <div class="muted">

    ${settled
     ?'Results are in. See the leaderboard below.'
     :'The leaderboard appears once the results are in.'}

   </div>

  </div>

 `:can?`

  <div class="muted">

   ${n} of ${tot} picked · round closes ${fmt(lock())}

  </div>

  <div class="bar">
   <i style="width:${n/tot*100}%"></i>
  </div>

 `:`

  <div class="panel">
   <b>This round is closed.</b>
  </div>

 `}

 ${cards}

 ${can?`

  <button
   class="full"
   id="sub"
   ${n<tot||busy?'disabled':''}>

   ${busy?'Submitting…':`Submit ${tot} predictions`}

  </button>

 `:''}

 <div class="err">${esc(err)}</div>

 ${board(settled)}

 `;

 app.querySelectorAll('[data-f]').forEach(b=>{

  b.onclick=()=>{

   if(busy||!open()||S.entry)return;

   S.picks[b.dataset.f]=b.dataset.k;

   err='';

   round();
  };

 });

 const s=document.querySelector('#sub');

 if(s){

  s.onclick=async()=>{

   if(busy||!open()||S.entry)return;

   if(S.fix.some(f=>!S.picks[f.id]))return;

   if(!S.consent){
    err='Please accept the participation rules first.';
    return welcome();
   }

   busy=true;

   round();

   const j=await call('submit',{
    round_id:S.round.id,
    picks:S.picks,
    consent:S.consent
   });

   busy=false;

   err=j.ok?'':(j.error||'Could not submit');

   if(j.ok){
    await load();
   }

   render();

  };

 }

}

function board(settled){

 if(!settled)return '';

 return`

 <h2>Leaderboard</h2>

 <div class="panel">

 ${S.lb.length?S.lb.map(p=>`

  <div class="lb ${p.is_me?'me':''}">

   <span>

    ${esc(p.pos)}. ${esc(p.name)}

    ${p.pos<=S.round.winners?`
     <span class="tag ok">
      ${esc(S.round.prize)}
     </span>
    `:''}

   </span>

   <span>
    ${esc(p.score)}/${S.fix.length}
   </span>

  </div>

 `).join(''):`

  <div class="muted">No entries.</div>

 `}

 </div>

 `;

}

boot();

</script>
</body>
</html>
